name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend – Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SupermarketAPI/SupermarketAPI.csproj

      - name: Build (Release)
        run: dotnet build SupermarketAPI/SupermarketAPI.csproj --configuration Release --no-restore

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            dotnet test --configuration Release --verbosity normal
          else
            echo "No test projects found – skipping tests."
          fi

  frontend:
    name: Frontend – Build (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
