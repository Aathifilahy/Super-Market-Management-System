name: CD – Backend Deploy to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'SupermarketAPI/**'

jobs:
  deploy-backend:
    name: Build & Deploy to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SupermarketAPI/SupermarketAPI.csproj

      - name: Build (Release)
        run: dotnet build SupermarketAPI/SupermarketAPI.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SupermarketAPI/SupermarketAPI.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: supermarket-api-uksuper-c2cyhjepeyfgfvar
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
