name: CD - Frontend Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend-vercel.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate required Vercel secrets
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN is missing" >&2
            exit 1
          fi

          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "VERCEL_ORG_ID is missing" >&2
            exit 1
          fi

          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_PROJECT_ID is missing" >&2
            exit 1
          fi

      - name: Verify Vercel authentication
        run: vercel whoami --token="${VERCEL_TOKEN}"

      - name: Pull Vercel Environment Information (Production)
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Project Artifacts (Production)
        working-directory: frontend
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel (Production)
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"